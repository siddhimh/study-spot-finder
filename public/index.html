<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cafe Finder</title>

    <style>
        :root {
            --accent: #1e7f4f;
            --accent-dark: #16643e;
            --text-main: #0f1f17;
            --text-muted: #5f6f68;
            --card-bg: #ffffff;
            --card-border: #e2efe7;
            --box-bg: #f2faf5;
            --box-border: #c7e4d3;
        }

        * { box-sizing: border-box; }

        body {
            font-family: Inter, Arial, sans-serif;
            padding: 24px;
            background: #ffffff;
            color: var(--text-main);
        }

        h2 {
            margin-bottom: 10px;
        }

        #loadButton {
            padding: 10px 22px;
            font-size: 15px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 8px 18px rgba(12,77,46,0.35);
            transition: all 0.2s ease;
        }

        #loadButton:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(8,58,35,0.45);
        }

        .spots-wrapper {
            margin-top: 24px;
            padding: 18px;
            background: var(--box-bg);
            border-radius: 18px;
            border: 1px solid var(--box-border);
        }

        .spots-wrapper.hidden { display: none; }

        .spots-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 20px;
        }

        @media (max-width: 1200px) {
            .container { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 900px) {
            .container { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 6px 18px rgba(0,0,0,0.04);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 14px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .card-info {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 10px;
            font-size: 13px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.18s ease;
        }

        .directions-btn {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .directions-btn:hover {
            background: var(--accent-dark);
            border-color: var(--accent-dark);
        }

        .website-btn {
            background: #0f1f17;
            color: white;
            border-color: #0f1f17;
        }

        .website-btn:hover {
            background: #000;
            border-color: #000;
        }

        .btn-disabled {
            opacity: 0.35;
            pointer-events: none;
        }

        .empty-message {
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

<h2>Nearby Cafes</h2>
<button id="loadButton">Find Nearby Cafes</button>

<div id="spotsBox" class="spots-wrapper hidden">
    <div class="spots-title">Best Visited Cafes</div>
    <div id="spots" class="container"></div>
</div>

<script>
async function trackClick(action, spot) {
    try {
        fetch("http://localhost:3000/place/click", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                action,
                place_id: spot.id,
            })
        });
    } catch (e) {
        console.error("Tracking failed", e);
    }
}

function loadSpots() {
    const spotsContainer = document.getElementById("spots");
    const spotsBox = document.getElementById("spotsBox");

    spotsContainer.innerHTML = "";
    spotsBox.classList.remove("hidden");

    if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
    }

    navigator.geolocation.getCurrentPosition(async (position) => {
        const { latitude, longitude } = position.coords;
        const timestamp = Date.now();

        try {
            const res = await fetch(
                `http://localhost:3000/place/find?latitude=${latitude}&longitude=${longitude}&timestamp=${timestamp}`
            );
            const data = await res.json();

            if (!data?.data?.places?.length) {
                spotsContainer.innerHTML = '<p class="empty-message">No cafes found nearby.</p>';
                return;
            }

            data.data.places.forEach(spot => {
                const photoURL = spot.photo || "https://via.placeholder.com/400x250?text=Cafe";
                const rating = spot.rating ? `⭐ ${spot.rating}` : "No rating";
                const mapsURL = spot.google_maps_url || "";
                const websiteURL = spot.website_url || "";

                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    <img src="${photoURL}" alt="${spot.name}">
                    <div class="card-body">
                        <div class="card-title">${spot.name}</div>
                        <div class="card-info">${rating}</div>
                        <div class="card-actions">
                            <a class="action-btn directions-btn ${mapsURL ? "" : "btn-disabled"}">Directions</a>
                            <a class="action-btn website-btn ${websiteURL ? "" : "btn-disabled"}">Website</a>
                        </div>
                    </div>
                `;

                card.addEventListener("click", (e) => {
                    if (e.target.closest(".action-btn")) return;
                    trackClick("view", spot);
                });

                const directionsBtn = card.querySelector(".directions-btn");
                if (mapsURL) {
                    directionsBtn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        window.open(mapsURL, "_blank", "noopener");
                        trackClick("directions", spot);
                    });
                }

                const websiteBtn = card.querySelector(".website-btn");
                if (websiteURL) {
                    websiteBtn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        window.open(websiteURL, "_blank", "noopener");
                        trackClick("details", spot);
                    });
                }

                spotsContainer.appendChild(card);
            });

        } catch (err) {
            console.error(err);
            spotsContainer.innerHTML = '<p class="empty-message">Error fetching cafes.</p>';
        }

    }, () => {
        spotsContainer.innerHTML = '<p class="empty-message">Unable to retrieve your location.</p>';
        spotsBox.classList.remove("hidden");
    });
}

document.getElementById("loadButton").addEventListener("click", loadSpots);
</script>

</body>
</html>
